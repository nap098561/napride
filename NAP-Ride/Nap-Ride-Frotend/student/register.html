<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Registration | NAP Ride</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div class="auth-shell">
  <section class="auth-side">
    <div class="brand"><span class="brand-badge">N</span> NAP Ride</div>
    <h1>Student Portal</h1>
    <p class="lead" style="color:#cbd5e1">Book rides, track drivers and manage your travel history.</p>
  </section>
  <main class="auth-main">
    <div class="auth-card">
      <p class="eyebrow">Student access</p>
      <h2>Create your account</h2>
      <div class="role-note"><span>●</span><span>Book rides, track drivers and manage your travel history.</span></div>
      <form method="post" action="">
        
        <div class="form-group"><label for="fullName">Full name</label><input id="fullName" name="fullName" required autocomplete="name" placeholder="Enter full name"></div>
        <div class="form-group"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="+234 800 000 0000"></div>
        <div class="form-group"><label for="schoolEmail">School email</label><input id="schoolEmail" name="schoolEmail" type="email" required placeholder="name@university.edu.ng"><div class="field-help">Use your official university email address.</div></div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="Enter password">
            <button class="input-action" type="button" data-password-toggle="password">Show</button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%" type="submit">Create account</button>
      </form>
      <p class="small" style="margin-top:16px"><a href="../index.html">← Back to home</a></p>
      <p class="small">Already have an account? <a href="login.html"><strong>Sign in</strong></a></p>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body></html>
