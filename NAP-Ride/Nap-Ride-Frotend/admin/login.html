<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | NAP Ride</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div class="auth-shell">
  <section class="auth-side">
    <div class="brand"><span class="brand-badge">N</span> NAP Ride</div>
    <h1>Admin Portal</h1>
    <p class="lead" style="color:#cbd5e1">Manage drivers, students, rides and platform operations.</p>
  </section>
  <main class="auth-main">
    <div class="auth-card">
      <p class="eyebrow">Admin access</p>
      <h2>Welcome back</h2>
      <div class="role-note"><span>●</span><span>Manage drivers, students, rides and platform operations.</span></div>
      <form method="post" action="">
        <div class="form-group"><label for="identity">Email or phone number</label><input id="identity" name="identity" required autocomplete="username" placeholder="Enter email or phone number"></div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter password">
            <button class="input-action" type="button" data-password-toggle="password">Show</button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
      </form>
      <p class="small" style="margin-top:16px"><a href="../index.html">← Back to home</a></p>
      
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body></html>
